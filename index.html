<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bay Of Bengal Restaurant digital QR menu" />
  <meta name="theme-color" content="#075b68" />
  <title>Bay Of Bengal Restaurant | Digital Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#menu">Skip to menu</a>
  <header class="hero" id="top">
    <nav class="topbar container" aria-label="Primary navigation">
      <a class="brand" href="#top" aria-label="Bay Of Bengal Restaurant home"><span class="brand-mark" aria-hidden="true">B</span><span>Bay Of Bengal<small>RESTAURANT</small></span></a>
      <button class="icon-btn theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme"><span aria-hidden="true">☾</span></button>
    </nav>
    <!--
    <div class="hero-content container">
      <p class="eyebrow">COASTAL DINING · DHAKA</p>
      <h1>A table by the<br><em>Bay of Bengal.</em></h1>
      <p class="tagline">Taste the Sea, Feel the Bengal</p>
      <div class="restaurant-meta" aria-label="Restaurant information">
        <span>⌖ Gulshan Avenue, Dhaka</span><span>◷ Open today · 11 AM – 11 PM</span>
      </div>
      <a class="contact-btn" href="tel:+8801700000000">Call for a table <span aria-hidden="true">↗</span></a>
    </div>
    -->
    <div class="hero-wave" aria-hidden="true"></div>
  </header>

  <main>
    <!--
    <section class="recommendations container" aria-labelledby="recommendation-title">
      <div class="section-heading"><div><p class="eyebrow">SIGNATURE SELECTION</p><h2 id="recommendation-title">Chef's Recommendations</h2></div><span class="swipe-note">Swipe to explore →</span></div>
      <div class="recommendation-track" id="recommendationTrack" aria-label="Chef's recommended dishes"></div>
    </section>

    <section class="menu-section" id="menu" aria-labelledby="menu-title">
      <div class="container">
        <div class="menu-intro"><div><p class="eyebrow">MADE WITH CARE</p><h2 id="menu-title">Our Menu</h2></div><span id="resultCount" aria-live="polite"></span></div>
        <label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search dishes..." autocomplete="off" /><button id="clearSearch" type="button" aria-label="Clear search" hidden>×</button></label>
      </div>
      <div class="category-wrap"><div class="categories container" id="categories" role="tablist" aria-label="Menu categories"></div></div>
      <div class="container"><div class="food-grid" id="foodGrid" aria-live="polite"></div><div class="no-results" id="noResults" hidden><span>⌕</span><h3>No dishes found</h3><p>Try another search or browse every category.</p><button class="text-button" id="resetFilters" type="button">View all dishes</button></div></div>
    </section>
    -->
  </main>

  <footer><div class="container footer-inner"><div class="footer-brand"><span class="brand-mark">B</span><div><strong>Bay Of Bengal</strong><p>Taste the Sea, Feel the Bengal</p></div></div><p>© <span id="year"></span> Bay Of Bengal Restaurant</p><a href="#top">Back to top ↑</a></div></footer>

  <button class="cart-fab" id="cartButton" type="button" aria-label="Open cart" aria-haspopup="dialog"><span class="cart-icon" aria-hidden="true">🛍</span><span>Your order</span><b id="cartCount">0</b></button>
  <button class="back-top" id="backTop" type="button" aria-label="Back to top">↑</button>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="Your order" aria-modal="true" role="dialog" aria-hidden="true" tabindex="-1">
    <div class="drawer-head"><div><p class="eyebrow">YOUR SELECTION</p><h2>Your order</h2></div><button class="close-btn" id="closeCart" type="button" aria-label="Close cart">×</button></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-empty" id="cartEmpty"><span>🫧</span><h3>Your basket is waiting</h3><p>Add something delicious from the menu.</p><button class="primary-btn close-cart-button" type="button">Browse menu</button></div>
    <div class="cart-summary" id="cartSummary" hidden><div><span>Subtotal</span><strong id="subtotal">€0.00</strong></div><div><span>Service charge</span><strong id="serviceCharge">€0.00</strong></div><div class="total"><span>Total</span><strong id="total">€0.00</strong></div><div class="cart-actions"><button id="clearCart" class="ghost-btn" type="button">Clear cart</button><button id="orderButton" class="primary-btn" type="button">Place order <span>→</span></button></div></div>
  </aside>

  <div class="modal-backdrop" id="modalBackdrop" hidden></div>
  <section class="food-modal" id="foodModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true" tabindex="-1"><button class="close-btn modal-close" id="closeModal" type="button" aria-label="Close details">×</button><div id="modalContent"></div></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js" defer></script>
</body>
</html>
